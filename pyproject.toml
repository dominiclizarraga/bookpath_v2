[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookpath"
version = "0.1.0"
description = "Book discovery and recommendation tools"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "pyarrow>=25.0.1",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
]
